spring:
  datasource:
    url: ${TEST_DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc.lob.non_contextual_creation: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

firebase:
  admin:
    enabled: false